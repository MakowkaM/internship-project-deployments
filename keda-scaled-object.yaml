apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llm-worker-scaler
spec:
  scaleTargetRef:
    name: llm-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10
  triggers:
    - type: postgresql
      metadata:
        query: "SELECT COUNT(*) FROM llm_tasks WHERE status='pending'"
        targetQueryValue: "5"
      authenticationRef:
        name: db-trigger-auth
