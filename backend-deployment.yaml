apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: REPOSITORY_URI/ECR_BACKEND_REPO:1
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: notes-secret